<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento e Administração da Manutenção</title>
    
    <!-- Fonte moderna do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-radius: 16px;
            --shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.05), 0 8px 10px -6px rgba(37, 99, 235, 0.05);
            --shadow-hover: 0 20px 30px -10px rgba(37, 99, 235, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        header {
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .menu-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            width: 100%;
        }

        /* Container dos Cards / Dropdowns */
        .dropdown,
        .menu-card-item {
            flex: 1;
            min-width: 260px;
            max-width: 340px;
            position: relative;
        }

        .card-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-main);
            text-decoration: none;
            padding: 40px 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .card-button:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-color);
            background-color: #ffffff;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            transition: color 0.2s ease;
        }

        .card-button:hover .card-title {
            color: var(--primary-color);
        }

        /* Submenu de opções do Dropdown */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.06);
            overflow: hidden;
            z-index: 10;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Exibe as opções ao focar/clicar no botão */
        .dropdown:focus-within .dropdown-menu {
            display: block;
        }

        .dropdown-item {
            display: block;
            padding: 16px 20px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        @media (max-width: 580px) {
            h1 { font-size: 1.7rem; }
            p.subtitle { font-size: 1rem; }
            .card-button { padding: 30px 20px; }
            .dropdown, .menu-card-item { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Planejamento e Administração da Manutenção</h1>
            <p class="subtitle">Escolha uma atividade abaixo para começar</p>
        </header>

        <nav class="menu-grid">
            <!-- 1. Tipos de Manutenção (Menu Dropdown) -->
            <div class="dropdown">
                <button class="card-button" aria-haspopup="true">
                    <span class="card-title">Tipos de Manutenção</span>
                </button>
                
                <div class="dropdown-menu">
                    <a href="./manutençãopreditiva.html" class="dropdown-item">Manutenção Preditiva</a>
                    <a href="./preventiva.html" class="dropdown-item">Manutenção Preventiva</a>
                    <a href="./corretiva.html" class="dropdown-item">Manutenção Corretiva</a>
                </div>
            </div>

            <!-- 2. Aplicações da Manutenção -->
            <div class="menu-card-item">
                <a href="./aplicacao.html" class="card-button">
                    <span class="card-title">Aplicações da Manutenção</span>
                </a>
            </div>

            <!-- 3. Ferramentas da qualidade - Ishikawa e Pareto -->
            <div class="menu-card-item">
                <a href="qualidade.html" class="card-button">
                    <span class="card-title">Ferramentas da qualidade - Ishikawa e Pareto</span>
                </a>
            </div>

            <!-- 4. Ferramentas da qualidade – GUT e 5W2H -->
            <div class="menu-card-item">
                <a href="gut5w2h.html" class="card-button">
                    <span class="card-title">Ferramentas da qualidade – GUT e 5W2H</span>
                </a>
            </div>

            <!-- 5. Gestor da manutenção -->
            <div class="menu-card-item">
                <a href="gestor.html" class="card-button">
                    <span class="card-title">Gestor da manutenção</span>
                </a>
            </div>
        </nav>
    </div>

</body>
</html>
